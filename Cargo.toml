[workspace]
members = ["crates/vietkara-app", "crates/vietkara-domain", "crates/vietkara-storage", "crates/vietkara-jobs", "crates/vietkara-media", "crates/vietkara-render", "crates/vietkara-ai-bridge"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1"

